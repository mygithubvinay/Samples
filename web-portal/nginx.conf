server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Single-page app: send every route (/about, /contact...) to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache built assets (filenames are hashed)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
